<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password • VideoHub</title>
  <link rel="stylesheet" href="/static/css/youtube.css">
  <style>
    .box{max-width:460px;margin:80px auto;padding:1.2rem;border:1px solid var(--border-color);border-radius:10px;background:var(--card-bg)}
    .g{display:grid;gap:.6rem}
    input{padding:.6rem;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-color);color:var(--text-primary)}
    .btn{padding:.6rem 1rem;border:none;border-radius:8px;background:var(--primary-color);color:#fff;font-weight:700;cursor:pointer;width:100%}
    a{color:var(--primary-color)}
  </style>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 .6rem;color:var(--primary-color)">Choose a new password</h2>
    <form method="post" action="/auth/reset" class="g">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="new_password" placeholder="New password" minlength="6" required>
      <input type="password" name="confirm_password" placeholder="Confirm password" minlength="6" required>
      <button class="btn" type="submit">Reset Password</button>
    </form>
    <p style="margin-top:.6rem"><a href="/login">&larr; Back to Login</a></p>
  </div>
</body>
</html>
